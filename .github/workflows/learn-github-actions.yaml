# Nama workflow Anda, akan muncul di tab "Actions" di GitHub
name: CI/CD untuk Node.js dengan Docker

# Menentukan event yang akan memicu workflow ini
# Dalam kasus ini, workflow akan berjalan setiap kali ada 'push'
on: 
  push:
    branches:
      - main

# Mendefinisikan satu atau lebih pekerjaan (jobs) yang akan dijalankan
jobs:
  # Job pertama: Build dan Test
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      # Step 1: Menggunakan action 'checkout' untuk mengunduh kode repositori Anda ke runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js sesuai versi dari matrix
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Menggunakan cache untuk mempercepat instalasi dependensi
          cache: 'npm'

      # 3. Menginstal dependensi proyek
      # 'npm ci' lebih cepat dan aman untuk lingkungan CI daripada 'npm install'
      - name: Install dependencies
        run: npm ci

      # 4. Menjalankan tes. Kita akan tambahkan ini nanti.
      - name: Run tests
        run: npm test

  # Job kedua: Build dan Push Docker Image ke Docker Hub
  build-and-push-docker:
    # Jalankan job ini hanya jika job 'build-and-test' berhasil
    needs: build-and-test
    runs-on: ubuntu-22.04
    steps:
      # 1. Checkout kode repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login ke Docker Hub menggunakan secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build dan Push image dalam satu langkah
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag image dengan format: username/repo:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest